<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔮AVA TAROT🔮 : Let AVA predict your wallet fortune.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lightgallery@2.8.3/css/lightgallery-bundle.min.css">
    <link rel="stylesheet" href="styles.css?t=250312">
    <link rel="stylesheet" href="app.css?t=250313">
</head>
<body>
    <video autoplay muted loop id="background-video">
        <source src="https://avawalk.github.io/avatarot/assets/videos/0217.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <div id="overlay" style="display: none;"></div>

    <video id="prediction-video" style="display: none;" autoplay muted>
        <source src="https://avawalk.github.io/avatarot/assets/videos/action gb.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <div id="content">
        <h1>🔮 Ava Tarot 🔮</h1>
        <h3>The Wallet Prophet</h3>
        <h5>Checking your wallet's fortune before trading every day.</h5>

        <input id='phantom-wallet' type='text' placeholder='Enter Phantom Wallet'>
        <button id="connect-wallet">Submit</button>

        <div id="wallet-info" style="display: none;">
            <p>Wallet Submitted: <span id="wallet-address"></span></p>
        </div>

        <button id="draw-card" style="display: none;">Draw a Tarot Card</button>

        <div id="tarot-container">
            <div class="card">
                <img src="https://avawalk.github.io/avatarot/assets/tarot/back-of-card.png" alt="Back of Card">
                <p class="card-name" style="display: none;"></p>
            </div>
            <div class="card">
                <img src="https://avawalk.github.io/avatarot/assets/tarot/back-of-card.png" alt="Back of Card">
                <p class="card-name" style="display: none;"></p>
            </div>
            <div class="card">
                <img src="https://avawalk.github.io/avatarot/assets/tarot/back-of-card.png" alt="Back of Card">
                <p class="card-name" style="display: none;"></p>
            </div>
        </div>

        <div id="fortune-result" style="display: none;">
            <h2>Your Wallet's Fortune Score: <span id="fortune-score"></span></h2>
            <h3>Crypto vibes check! Today, Your wallet is at level <span id="fortune-grade"></span></h3>
            <p id="fortune-advice"></p>
        </div>

        <div id="boosted-tokens" style="display: none;">
            <h3 id="boosted-tokens-header" style="display: none;">🎲 Try Your Luck 🎲</h3>
            <p id="loading-message">Loading for Tokens...</p>
            <div id="boosted-tokens-list"></div>
        </div>

        <!-- links -->
        <div class='links'>
          <a href='https://x.com/avathecutetiger' target='_blank'><img src='https://avawalk.github.io/avatarot/assets/twitter.png'></a>
          <a href='https://t.me/avactosol' target='_blank'><img src='https://avawalk.github.io/avatarot/assets/telegram.png'></a>
        </div>

    </div>

    <!-- credit -->
    <img class='credit' src='https://avawalk.github.io/avatarot/assets/cred2.png'>

    <!-- music -->
    <audio loop>
      <source src="https://avawalk.github.io/avatarot/assets/bgmavatarot.wav" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js" integrity="sha256-2Pmvv0kuTBOenSvLm6bvfBSSHrUJ+3A7x6P5Ebd07/g=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/lightgallery@2.8.3/lightgallery.umd.min.js"></script>
    <script src="app.js?t=250313"></script>
    <script>
      let aud = $('audio')[0];
      $('body').click(_ => {
        if (!aud.paused) return;
        aud.play();
      });
    </script>
</body>
</html>
